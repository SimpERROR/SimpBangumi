name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Package type
        required: true
        type: choice
        default: unsigned-device
        options:
          - unsigned-device
      build_number:
        description: CFBundleVersion; leave blank to use the workflow run number
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: IPA (${{ inputs.export_method }})
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init -- --ci

      - name: Build unsigned iOS IPA
        env:
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -euo pipefail
          npm run tauri ios build -- \
            --ci \
            --no-sign \
            --build-number "$BUILD_NUMBER"

          IPA_PATH=$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo 'No unsigned iOS IPA was produced.'
            exit 1
          fi

      - name: Locate unsigned IPA
        id: ipa
        run: |
          IPA_PATH=$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo 'No IPA was generated.'
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "Generated unsigned IPA: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpBangumi-ios-unsigned-${{ inputs.build_number || github.run_number }}
          if-no-files-found: error
          path: ${{ steps.ipa.outputs.path }}
